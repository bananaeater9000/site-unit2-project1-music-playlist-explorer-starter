<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Music Playlist Explorer</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Music Playlist Explorer</h1>
        <div class="hamburger-menu">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </div>
    </header>

    <main>
        <div id="playlist-gallery">
            <div class="playlist-cards">
                <!-- Playlist cards will be dynamically loaded from data.json -->
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <button class="close-button">&times;</button>
            <div class="modal-header">
                <div class="modal-playlist-info">
                    <img class="modal-playlist-image" src="assets/img/playlist.png" alt="Playlist cover">
                    <div class="modal-playlist-details">
                        <h2 class="modal-playlist-title">Playlist Title</h2>
                        <p class="modal-creator-name">Creator Name</p>
                    </div>
                </div>
                <button class="shuffle-button">Shuffle</button>
            </div>

            <div class="modal-body">
                <div class="song-list">
                    <!-- Songs will be dynamically loaded when modal opens -->
                </div>
            </div>
        </div>
    </div>

    <script src="data/data.js"></script>
    <script src="script.js"></script>
</body>
</html>
